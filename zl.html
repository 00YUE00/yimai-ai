    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",SimSun,serif;}
        body{
            background-color:#f5efe0;
            position:relative;
            min-height:100vh;
            padding:40px;
        }
        .corner{
            position:fixed;
            width:160px;
            height:160px;
            pointer-events:none;
            z-index:1;
        }
        .corner-tl{top:20px;left:20px;}
        .corner-tr{top:20px;right:20px;transform: rotate(90deg);}
        .corner-bl{bottom:20px;left:20px;transform: rotate(-90deg);}
        .corner-br{bottom:20px;right:20px;transform: rotate(180deg);}
        .corner svg{width:100%;height:100%;}
        .header{text-align:center;margin-bottom:16px;position:relative;z-index:2;}
        .header h1{font-size:36px;color:#4a3b2b;letter-spacing:4px;}
        .header p{font-size:16px;color:#6b5a47;margin-top:6px;}
        .nav{
            display:flex;
            justify-content:center;
            gap:8px;
            background:rgba(120,95,65,0.12);
            padding:14px;
            border-radius:10px;
            margin-bottom:32px;
            flex-wrap:wrap;
            position:relative;z-index:2;
        }
        .nav a{
            text-decoration:none;
            color:#4a3b2b;
            padding:8px 18px;
            border-radius:6px;
            font-size:16px;
        }
        .nav a.active{background:#705c3e;color:#fff;}
        .nav a:hover{background:rgba(112,92,62,0.25);}
        .main{position:relative;z-index:2;}
        .main h1{font-size:28px;color:#4a3b2b;margin-bottom:8px;}
        .main .desc{color:#6b5a47;margin-bottom:24px;}
        .title-tip{margin-bottom:20px;font-size:20px;font-weight:bold;color:#4a3b2b;}
        .card-wrap{display:grid;grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));gap:26px;}
        .func-card{
            background:rgba(255,255,255,0.45);
            border:1px solid #d4c7b0;
            border-radius:10px;
            overflow:hidden;
            box-shadow:0 2px 8px rgba(74,59,43,0.12);
        }
        .card-img{height:160px;background:#e9e0cd;display:flex;align-items:center;justify-content:center;color:#555;font-size:14px;}
        .card-body{padding:20px;}
        .card-body h3{margin-bottom:10px;font-size:20px;color:#4a3b2b;}
        .card-body p{color:#5c4d3b;font-size:14px;line-height:1.6;margin-bottom:16px;}
        .card-btn{
            background:#705c3e;color:#fff;
            border:none;padding:9px 16px;border-radius:6px;cursor:pointer;
        }
        .card-btn:hover{background:#5c4b32;}
    </style>
</head>
