<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>版权存证中心 | 艺脉AI</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",SimSun,serif;}
        body{
            background-color:#f5efe0;
            position:relative;
            min-height:100vh;
            padding:40px;
        }
        .corner{
            position:fixed;
            width:160px;
            height:160px;
            pointer-events:none;
            z-index:1;
        }
        .corner-tl{top:20px;left:20px;}
        .corner-tr{top:20px;right:20px;transform: rotate(90deg);}
        .corner-bl{bottom:20px;left:20px;transform: rotate(-90deg);}
        .corner-br{bottom:20px;right:20px;transform: rotate(180deg);}
        .corner svg{width:100%;height:100%;}
        .header{text-align:center;margin-bottom:16px;position:relative;z-index:2;}
        .header h1{font-size:36px;color:#4a3b2b;letter-spacing:4px;}
        .header p{font-size:16px;color:#6b5a47;margin-top:6px;}
        .nav{
            display:flex;
            justify-content:center;
            gap:8px;
            background:rgba(120,95,65,0.12);
            padding:14px;
            border-radius:10px;
            margin-bottom:32px;
            flex-wrap:wrap;
            position:relative;z-index:2;
        }
        .nav a{
            text-decoration:none;
            color:#4a3b2b;
            padding:8px 18px;
            border-radius:6px;
            font-size:16px;
        }
        .nav a.active{background:#705c3e;color:#fff;}
        .nav a:hover{background:rgba(112,92,62,0.25);}
        .main{position:relative;z-index:2;}
        .main h1{font-size:28px;color:#4a3b2b;margin-bottom:8px;}
        .main .desc{color:#6b5a47;margin-bottom:24px;}
        .box{background:rgba(255,255,255,0.45);padding:25px;border-radius:10px;border:1px solid #d4c7b0;box-shadow:0 2px 6px rgba(74,59,43,0.12);}
        input{width:100%;padding:10px;margin:10px 0;border:1px solid #c9b9a0;border-radius:6px;background:#fff;}
        button{background:#705c3e;color:white;border:none;padding:12px 24px;border-radius:6px;cursor:pointer;font-size:16px;}
        button:hover{background:#5c4b32;}
        #cert{margin-top:20px;padding:15px;background:rgba(255,255,255,0.5);border:1px solid #d4c7b0;}
    </style>
</head>
<body>
    <div class="corner corner-tl">
        <svg viewBox="0 0 160 160">
            <path d="M 0,4 L 120,4 L 120,24 L 24,24 L 24,60 L 60,60 L 60,120 L 4,120 L4,0" stroke="#992828" stroke-width="4" fill="none"/>

    <div class="main">
        <h1>版权存证中心</h1>
        <p class="desc">上传作品，一键生成版权存证证书</p>
        <div class="box">
            <input type="text" placeholder="作品名称">
            <input type="file" accept="image/*">
            <button onclick="saveCopyright()">提交存证</button>
            <div id="cert"></div>
        </div>
    </div>
<script>
function saveCopyright(){
    const randomHash = Math.random().toString(36).slice(2);
    document.getElementById("cert").innerText = `版权存证成功！\n存证编号：${randomHash}\n已生成电子版权证书，支持溯源校验`;
}
</script>
